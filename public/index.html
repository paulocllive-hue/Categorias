<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo A14 Representações. Conheça Kamai, Mega Batatas e Doce Bem e faça pedidos para sua empresa.">
  <title>A14 Representações | Catálogo comercial</title>
  <link rel="stylesheet" href="./estilo.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="pular" href="#principal">Ir para o conteúdo</a>
  <header class="cabecalho">
    <div class="container barra">
      <a class="logo" href="#" aria-label="A14 Representações, página inicial">
        <img class="logo-imagem" src="./img/logo-a14.png" alt="A14">
        <span class="logo-subtitulo">Representações</span>
      </a>
      <nav aria-label="Navegação principal">
        <a href="#marcas">Marcas</a>
        <a href="#produtos">Produtos</a>
        <a href="#contatos">Contato</a>
      </nav>
      <div class="acoes">
        <span id="perfil-atual" class="perfil-atual" hidden></span>
        <button type="button" class="acao-conta" id="conta">Entrar</button>
        <button type="button" class="acao-conta" id="cadastrar">Cadastrar</button>
        <button type="button" class="acao-conta" id="meus-pedidos" hidden>Meus pedidos</button>
        <button type="button" class="acao-conta" id="sair" hidden>Sair</button>
        <button type="button" class="botao botao-carrinho" id="carrinho">Carrinho <span id="quantidade">0</span></button>
      </div>
    </div>
  </header>
  <main id="principal">
    <h1 class="somente-leitor">Catálogo A14 Representações</h1>
    <p class="container carregamento" id="estado-site" role="status">Carregando catálogo…</p>

    <section class="banner container" aria-label="Destaques das marcas" aria-roledescription="carrossel" hidden>
      <div class="banner-slides" id="banner-slides"></div>
      <div class="banner-controles">
        <div class="banner-indicadores" id="banner-indicadores" aria-label="Escolher destaque"></div>
        <div class="carrossel-controles">
          <button type="button" data-carrossel-anterior aria-label="Destaque anterior">←</button>
          <button type="button" data-carrossel-pausa>Pausar</button>
          <button type="button" data-carrossel-proxima aria-label="Próximo destaque">→</button>
        </div>
      </div>
    </section>

    <section class="container marcas-faixa" id="marcas" aria-labelledby="titulo-marcas" hidden>
      <h2 id="titulo-marcas">Marcas representadas</h2>
      <div class="marcas-atalhos" id="marcas-atalhos"></div>
    </section>

    <div id="produtos">
      <div id="secoes-marcas"></div>
    </div>
  </main>

  <footer id="contatos">
    <div class="container rodape-grid">
      <div>
        <a class="logo" href="#" aria-label="Voltar ao início">
          <img class="logo-imagem" src="./img/logo-a14.png" alt="A14">
          <span class="logo-subtitulo">Representações</span>
        </a>
        <p>Pedidos para varejo, atacado e distribuidores.</p>
      </div>
      <section aria-labelledby="titulo-contatos">
        <h2 id="titulo-contatos">Contato</h2>
        <div id="lista-contatos"></div>
      </section>
      <section aria-labelledby="titulo-locais">
        <h2 id="titulo-locais">Onde encontrar</h2>
        <ul id="pontos-venda"></ul>
      </section>
    </div>
    <div class="container rodape-base">
      <p id="direitos">A14 Representações</p>
      <a href="#marcas">Voltar às marcas ↑</a>
    </div>
  </footer>

  <dialog id="painel" aria-labelledby="painel-titulo">
    <div class="painel-cabecalho">
      <h2 id="painel-titulo"></h2>
      <button class="fechar" id="fechar" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="painel-corpo">
      <p class="painel-mensagem" id="mensagem" role="status" hidden></p>
      <div id="conteudo"></div>
    </div>
  </dialog>
  <p id="aviso" class="aviso" role="status" hidden></p>

  <template id="cadastro-template">
    <form class="formulario" data-form="cadastro">
      <label>Nome do responsável<input name="nome" autocomplete="name" required minlength="2" maxlength="100"></label>
      <label>Razão social<input name="razao_social" autocomplete="organization" required minlength="2" maxlength="150"></label>
      <label>CNPJ<input name="cnpj" required minlength="14" maxlength="24" autocapitalize="characters" spellcheck="false"></label>
      <label>Perfil comercial
        <select name="perfil" required>
          <option value="">Selecione</option>
          <option value="varejista">Varejo</option>
          <option value="atacadista">Atacado</option>
          <option value="distribuidor">Distribuidor</option>
        </select>
      </label>
      <label>E-mail<input type="email" name="email" autocomplete="email" required maxlength="254"></label>
      <label>Senha<input type="password" name="senha" autocomplete="new-password" required minlength="10" maxlength="128"><small>Use pelo menos 10 caracteres.</small></label>
      <fieldset>
        <legend>Endereço de entrega</legend>
        <div class="campos-endereco">
          <label>CEP<input name="cep" aria-describedby="cep-status" autocomplete="postal-code" inputmode="numeric" required maxlength="9"></label>
          <label>UF<input name="uf" autocomplete="address-level1" required minlength="2" maxlength="2" autocapitalize="characters"></label>
          <label class="campo-largo">Logradouro<input name="logradouro" autocomplete="address-line1" required maxlength="150"></label>
          <label>Número<input name="numero" required maxlength="20"></label>
          <label>Complemento<input name="complemento" autocomplete="address-line2" maxlength="100"></label>
          <label>Bairro<input name="bairro" autocomplete="address-level3" required maxlength="80"></label>
          <label>Cidade<input name="cidade" autocomplete="address-level2" required maxlength="80"></label>
        </div>
        <p id="cep-status" class="cep-status" role="status">Informe o CEP para buscar o endereço. Confira o número e o complemento.</p>
      </fieldset>
      <label class="opcao-promocoes">
        <input type="checkbox" name="receber_promocoes">
        <span>Quero receber promoções por e-mail.</span>
      </label>
      <button class="botao botao-pedido" type="submit">Criar conta</button>
      <button class="link" data-acao="login" type="button">Já tenho uma conta</button>
    </form>
  </template>

  <template id="login-template">
    <form class="formulario" data-form="login">
      <label>E-mail<input type="email" name="email" autocomplete="username" required maxlength="254"></label>
      <label>Senha<input type="password" name="senha" autocomplete="current-password" required maxlength="128"></label>
      <button class="botao botao-pedido" type="submit">Entrar</button>
      <button class="link" data-acao="cadastro" type="button">Criar conta para minha empresa</button>
    </form>
  </template>
</body>
</html>
